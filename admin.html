<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Добавить пост</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background: #0066cc; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Добавить новый пост</h1>
  <form action="/add" method="POST" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="Заголовок" required>
    <textarea name="content" rows="6" placeholder="Текст поста" required></textarea>
    <input type="file" name="image" accept="image/*">
    <br><br>
    <button type="submit">Опубликовать</button>
  </form>
  <p><a href="/">← Назад к постам</a></p>
</body>
</html>
